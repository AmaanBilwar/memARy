services:
  - type: web
    name: memory-api
    env: python
    buildCommand: "cd api-service && pip install -r requirements.txt"
    startCommand: "cd api-service && gunicorn wsgi:application -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: VECTOR_STORE_URL
        value: "https://your-vector-store-url.com"  # Update this with your actual vector store URL
      - key: PORT
        value: "10000"